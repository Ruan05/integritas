services:
  gotenberg:
    image: gotenberg/gotenberg:8.37.0-chromium
    container_name: integritas-gotenberg
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 1g
    cpus: 2.0
